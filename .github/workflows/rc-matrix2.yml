name: rc-matrix2
# Commit this as .github/workflows/rc-matrix2.yml and matrix2.mjs at the repo root,
# then: Actions -> rc-matrix2 -> Run workflow.
on: workflow_dispatch
permissions:
  actions: write
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund @actions/artifact@6.3.1
      - name: run matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node matrix2.mjs
